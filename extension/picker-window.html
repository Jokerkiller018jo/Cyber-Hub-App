<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>CyberHub · Color Picker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg:            #09090b;
            --bg2:           #18181b;
            --accent:        #06b6d4;
            --accent-hover:  #22d3ee;
            --success:       #10b981;
            --warn:          #f59e0b;
            --border:        rgba(255,255,255,0.08);
            --text:          #f8fafc;
            --muted:         #94a3b8;
            --dim:           #475569;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            width: 360px;
            height: 340px;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Header ── */
        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px 10px;
            border-bottom: 1px solid var(--border);
            background: rgba(0,0,0,0.3);
        }
        .header-icon {
            width: 30px; height: 30px;
            background: rgba(6,182,212,0.12);
            border: 1px solid rgba(6,182,212,0.3);
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            color: var(--accent);
            flex-shrink: 0;
        }
        .header-title { font-size: 0.78rem; font-weight: 800; letter-spacing: 0.1em; }
        .header-brand { font-size: 0.6rem; font-weight: 600; letter-spacing: 0.18em; color: var(--accent); }
        .header-close {
            margin-left: auto;
            background: transparent;
            border: none;
            color: var(--muted);
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            display: flex; align-items: center;
            transition: color 0.12s, background 0.12s;
        }
        .header-close:hover { color: var(--text); background: rgba(255,255,255,0.06); }

        /* ── Status / Phase ── */
        .phase {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 0 24px;
            text-align: center;
        }

        /* Idle phase */
        .phase-idle {
            cursor: pointer;
            user-select: none;
            outline: none;
            transition: background 0.15s;
            border-radius: 12px;
            margin: 8px 12px;
            padding: 16px 20px;
        }
        .phase-idle:hover {
            background: rgba(6,182,212,0.06);
        }
        .phase-idle:active {
            transform: scale(0.98);
        }
        .phase-idle .phase-icon {
            width: 64px; height: 64px;
            background: rgba(6,182,212,0.12);
            border: 1px solid rgba(6,182,212,0.35);
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            color: var(--accent);
            animation: glow-pulse 2s ease-in-out infinite;
            transition: transform 0.15s, border-color 0.15s;
        }
        .phase-idle:hover .phase-icon {
            transform: scale(1.05);
            border-color: var(--accent-hover);
        }
        @keyframes glow-pulse {
            0%,100% { box-shadow: 0 0 0 rgba(6,182,212,0); }
            50%      { box-shadow: 0 0 24px rgba(6,182,212,0.25); }
        }
        .phase-idle .phase-label { font-size: 0.9rem; font-weight: 700; color: var(--text); }
        .phase-idle .phase-sub   { font-size: 0.74rem; color: var(--muted); line-height: 1.5; }
        .phase-idle .phase-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 999px;
            background: rgba(6,182,212,0.15);
            border: 1px solid rgba(6,182,212,0.3);
            color: var(--accent);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            margin-top: 4px;
        }

        /* Picking phase */
        .phase-picking .phase-icon {
            width: 60px; height: 60px;
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            color: var(--warn);
            background: rgba(245,158,11,0.1);
            border: 1px solid rgba(245,158,11,0.3);
            animation: warn-pulse 1s ease-in-out infinite;
        }
        @keyframes warn-pulse {
            0%,100% { box-shadow: 0 0 0 rgba(245,158,11,0); }
            50%      { box-shadow: 0 0 20px rgba(245,158,11,0.2); }
        }
        .phase-picking .phase-label { font-size: 0.85rem; font-weight: 700; color: var(--warn); }
        .phase-picking .phase-sub   { font-size: 0.72rem; color: var(--muted); }

        /* Result phase */
        .phase-result {
            padding: 0 20px;
            gap: 10px;
        }
        .result-swatch-wrap { position: relative; }
        .result-swatch {
            width: 72px; height: 72px;
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.15);
            cursor: pointer;
            transition: transform 0.12s;
        }
        .result-swatch:hover { transform: scale(1.05); }
        .result-swatch-glow {
            position: absolute; inset: -6px;
            border-radius: 18px;
            filter: blur(14px);
            opacity: 0.35;
            pointer-events: none;
            z-index: -1;
        }
        .result-vals {
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: flex-start;
        }
        .result-row { display: flex; align-items: center; gap: 8px; }
        .val-label  {
            font-size: 0.6rem; font-weight: 700; letter-spacing: 0.1em;
            color: var(--dim); width: 26px;
        }
        .val-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.76rem; color: var(--text);
        }
        .result-actions { display: flex; gap: 6px; width: 100%; }
        .action-btn {
            flex: 1;
            padding: 7px;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-size: 0.68rem; font-weight: 700; letter-spacing: 0.03em;
            cursor: pointer;
            transition: all 0.12s;
            border: 1px solid;
        }
        .action-btn.primary {
            background: rgba(6,182,212,0.12);
            border-color: rgba(6,182,212,0.35);
            color: var(--accent);
        }
        .action-btn.primary:hover {
            background: rgba(6,182,212,0.22);
            border-color: var(--accent-hover);
        }
        .action-btn.secondary {
            background: rgba(255,255,255,0.04);
            border-color: var(--border);
            color: var(--muted);
        }
        .action-btn.secondary:hover {
            background: rgba(255,255,255,0.08);
            color: var(--text);
        }
        .action-btn.success {
            background: rgba(16,185,129,0.12);
            border-color: rgba(16,185,129,0.35);
            color: var(--success);
        }

        /* Toast */
        .toast {
            position: fixed; bottom: 10px; left: 50%;
            transform: translateX(-50%) translateY(8px);
            background: rgba(16,185,129,0.15);
            border: 1px solid rgba(16,185,129,0.4);
            color: var(--success);
            font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em;
            padding: 4px 14px; border-radius: 999px;
            opacity: 0; pointer-events: none;
            transition: opacity 0.18s, transform 0.18s;
            backdrop-filter: blur(12px);
            white-space: nowrap;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* Hidden utility */
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="header-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <path d="M20.71 5.63l-2.34-2.34a1 1 0 0 0-1.41 0l-3.12 3.12-1.41-1.42-1.42 1.42 1.41 1.41-6.6 6.6A2 2 0 0 0 5 16v3h3a2 2 0 0 0 1.42-.59l6.6-6.6 1.41 1.42 1.42-1.42-1.42-1.41 3.12-3.12a1 1 0 0 0 0-1.65zM8 17H7v-1l6.59-6.59 1 1L8 17z"/>
            </svg>
        </div>
        <div>
            <div class="header-title">COLOR PICKER</div>
            <div class="header-brand">CYBERHUB</div>
        </div>
        <button class="header-close" id="closeBtn" title="Close">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
            </svg>
        </button>
    </div>

    <!-- Phase: Idle (shown before pick starts) -->
    <div class="phase phase-idle" id="phaseIdle" tabindex="0" role="button" aria-label="Tap to pick color">
        <div class="phase-icon">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor">
                <path d="M20.71 5.63l-2.34-2.34a1 1 0 0 0-1.41 0l-3.12 3.12-1.41-1.42-1.42 1.42 1.41 1.41-6.6 6.6A2 2 0 0 0 5 16v3h3a2 2 0 0 0 1.42-.59l6.6-6.6 1.41 1.42 1.42-1.42-1.42-1.41 3.12-3.12a1 1 0 0 0 0-1.65zM8 17H7v-1l6.59-6.59 1 1L8 17z"/>
            </svg>
        </div>
        <div>
            <div class="phase-label">Click or Press [Space] to Pick</div>
            <div class="phase-sub">Touch any pixel on your screen with the pen</div>
        </div>
        <div class="phase-badge">
            ⚡ Click Here to Activate Pen
        </div>
    </div>

    <!-- Phase: Picking (shown while EyeDropper is active) -->
    <div class="phase phase-picking hidden" id="phasePicking">
        <div class="phase-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                <path d="M20.71 5.63l-2.34-2.34a1 1 0 0 0-1.41 0l-3.12 3.12-1.41-1.42-1.42 1.42 1.41 1.41-6.6 6.6A2 2 0 0 0 5 16v3h3a2 2 0 0 0 1.42-.59l6.6-6.6 1.41 1.42 1.42-1.42-1.42-1.41 3.12-3.12a1 1 0 0 0 0-1.65zM8 17H7v-1l6.59-6.59 1 1L8 17z"/>
            </svg>
        </div>
        <div class="phase-label">Hover any pixel and click…</div>
        <div class="phase-sub">Press Esc to cancel</div>
    </div>

    <!-- Phase: Result -->
    <div class="phase phase-result hidden" id="phaseResult">
        <div style="display:flex; align-items:center; gap:16px; width:100%;">
            <div class="result-swatch-wrap">
                <div class="result-swatch" id="rSwatch" title="Click to copy HEX"></div>
                <div class="result-swatch-glow" id="rGlow"></div>
            </div>
            <div class="result-vals">
                <div class="result-row">
                    <span class="val-label">HEX</span>
                    <span class="val-text" id="rHex">—</span>
                </div>
                <div class="result-row">
                    <span class="val-label">RGB</span>
                    <span class="val-text" id="rRgb">—</span>
                </div>
                <div class="result-row">
                    <span class="val-label">HSL</span>
                    <span class="val-text" id="rHsl">—</span>
                </div>
            </div>
        </div>
        <div class="result-actions">
            <button class="action-btn primary" id="rCopyHex">Copy HEX</button>
            <button class="action-btn secondary" id="rCopyRgb">Copy RGB</button>
            <button class="action-btn secondary" id="rCopyHsl">Copy HSL</button>
            <button class="action-btn secondary" id="rPickAgain">Pick Again</button>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script src="picker-window.js"></script>
</body>
</html>

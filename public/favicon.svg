<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#090915" />
      <stop offset="100%" stop-color="#030308" />
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="invaderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <!-- Dark Rounded App Capsule -->
  <rect width="64" height="64" rx="16" fill="url(#bgGlow)" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Alien Monster 👾 Pixel Grid (8x8 styled invader) -->
  <g filter="url(#neonGlow)" transform="translate(12, 12)">
    <!-- Horns / Antennae -->
    <rect x="4" y="0" width="4" height="4" fill="url(#invaderGrad)"/>
    <rect x="32" y="0" width="4" height="4" fill="url(#invaderGrad)"/>
    <rect x="8" y="4" width="4" height="4" fill="url(#invaderGrad)"/>
    <rect x="28" y="4" width="4" height="4" fill="url(#invaderGrad)"/>
    
    <!-- Forehead -->
    <rect x="8" y="8" width="24" height="4" fill="url(#invaderGrad)"/>
    
    <!-- Eyes Row -->
    <rect x="4" y="12" width="8" height="4" fill="url(#invaderGrad)"/>
    <rect x="12" y="12" width="4" height="4" fill="#030308"/> <!-- Left eye -->
    <rect x="16" y="12" width="8" height="4" fill="url(#invaderGrad)"/>
    <rect x="24" y="12" width="4" height="4" fill="#030308"/> <!-- Right eye -->
    <rect x="28" y="12" width="8" height="4" fill="url(#invaderGrad)"/>

    <!-- Cheek & Face Center -->
    <rect x="0" y="16" width="40" height="4" fill="url(#invaderGrad)"/>
    <rect x="0" y="20" width="8" height="4" fill="url(#invaderGrad)"/>
    <rect x="12" y="20" width="16" height="4" fill="url(#invaderGrad)"/>
    <rect x="32" y="20" width="8" height="4" fill="url(#invaderGrad)"/>

    <!-- Mouth / Bottom Body -->
    <rect x="0" y="24" width="4" height="4" fill="url(#invaderGrad)"/>
    <rect x="8" y="24" width="4" height="4" fill="url(#invaderGrad)"/>
    <rect x="28" y="24" width="4" height="4" fill="url(#invaderGrad)"/>
    <rect x="36" y="24" width="4" height="4" fill="url(#invaderGrad)"/>

    <!-- Feet / Tentacles -->
    <rect x="8" y="28" width="8" height="4" fill="url(#invaderGrad)"/>
    <rect x="24" y="28" width="8" height="4" fill="url(#invaderGrad)"/>
    <rect x="4" y="32" width="4" height="4" fill="url(#invaderGrad)"/>
    <rect x="16" y="32" width="8" height="4" fill="url(#invaderGrad)"/>
    <rect x="32" y="32" width="4" height="4" fill="url(#invaderGrad)"/>
  </g>
</svg>
